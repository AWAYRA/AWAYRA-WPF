name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate repository files
        shell: pwsh
        run: |
          if (-not (Test-Path LICENSE)) { throw "LICENSE is missing." }
          if (-not (Test-Path SECURITY.md)) { throw "SECURITY.md is missing." }
          if (-not (Test-Path CONTRIBUTING.md)) { throw "CONTRIBUTING.md is missing." }
          if (Test-Path release) { throw "Generated release files must not be committed." }
          if (Get-ChildItem -Recurse -File -Include *.exe,*.msi,*.msix,*.appx,*.pfx,*.p12 -ErrorAction SilentlyContinue) {
            throw "Generated installers, executables, or signing certificates must not be committed."
          }

      - name: Restore
        run: dotnet restore Awayra.sln

      - name: Build
        run: dotnet build Awayra.sln -c Release --no-restore

      - name: Test core logic
        run: dotnet test tests/Awayra.Core.Tests/Awayra.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=core-tests.trx"

      - name: Test application logic
        run: dotnet test tests/Awayra.App.Tests/Awayra.App.Tests.csproj -c Release --no-build --logger "trx;LogFileName=app-tests.trx"
