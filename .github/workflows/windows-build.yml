name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate repository files
        shell: pwsh
        run: |
          if (-not (Test-Path LICENSE)) { throw "LICENSE is missing." }
          if (-not (Test-Path SECURITY.md)) { throw "SECURITY.md is missing." }
          if (-not (Test-Path CONTRIBUTING.md)) { throw "CONTRIBUTING.md is missing." }
          if (Test-Path release) { throw "Generated release files must not be committed." }
          if (Get-ChildItem -Recurse -File -Include *.exe,*.msi,*.msix,*.appx,*.pfx,*.p12 -ErrorAction SilentlyContinue) {
            throw "Generated installers, executables, or signing certificates must not be committed."
          }

      - name: Repository inventory
        shell: pwsh
        run: git ls-files | Sort-Object

      - name: Restore application
        run: dotnet restore Awayra.sln

      - name: Restore test projects
        shell: pwsh
        run: |
          dotnet restore tests/Awayra.Core.Tests/Awayra.Core.Tests.csproj
          dotnet restore tests/Awayra.App.Tests/Awayra.App.Tests.csproj

      - name: Build application
        run: dotnet build Awayra.sln -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test core logic
        run: dotnet test tests/Awayra.Core.Tests/Awayra.Core.Tests.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true --logger "trx;LogFileName=core-tests.trx" --results-directory artifacts/test-results/core

      - name: Test application logic
        run: dotnet test tests/Awayra.App.Tests/Awayra.App.Tests.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true --logger "trx;LogFileName=app-tests.trx" --results-directory artifacts/test-results/app

      - name: Validate test evidence
        shell: pwsh
        run: |
          $results = Get-ChildItem artifacts/test-results -Recurse -Filter *.trx
          if ($results.Count -ne 2) {
            throw "Expected two TRX result files, found $($results.Count)."
          }
          foreach ($result in $results) {
            [xml]$trx = Get-Content $result.FullName
            $counters = $trx.TestRun.ResultSummary.Counters
            if ([int]$counters.total -le 0) {
              throw "No tests were executed in $($result.Name)."
            }
            if ([int]$counters.failed -ne 0) {
              throw "Test failures were recorded in $($result.Name)."
            }
            Write-Host "$($result.Name): total=$($counters.total), passed=$($counters.passed), failed=$($counters.failed)"
          }

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awayra-test-results-${{ github.run_id }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error
          retention-days: 14
