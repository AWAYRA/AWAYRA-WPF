name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build-and-test
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Report runner
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          dotnet --info

      - name: Validate repository files
        shell: pwsh
        run: |
          if (-not (Test-Path LICENSE)) { throw "LICENSE is missing." }
          if (-not (Test-Path SECURITY.md)) { throw "SECURITY.md is missing." }
          if (-not (Test-Path CONTRIBUTING.md)) { throw "CONTRIBUTING.md is missing." }
          if (Test-Path release) { throw "Generated release files must not be committed." }
          if (Get-ChildItem -Recurse -File -Include *.exe,*.msi,*.msix,*.appx,*.pfx,*.p12 -ErrorAction SilentlyContinue) {
            throw "Generated installers, executables, or signing certificates must not be committed."
          }

      # The version lives in Directory.Build.props. app.manifest and the installer's fallback cannot
      # read it, so this proves they were bumped with it instead of drifting silently.
      - name: Validate version consistency
        shell: pwsh
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $version = [string](@($props.Project.PropertyGroup.Version | Where-Object { $_ })[0]).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Directory.Build.props Version must use semantic version format x.y.z. Found: $version"
          }

          [xml]$manifest = Get-Content "src/Awayra.App/app.manifest"
          if ($manifest.assembly.assemblyIdentity.version -ne "$version.0") {
            throw "app.manifest declares $($manifest.assembly.assemblyIdentity.version) but the product version is $version."
          }

          $iss = Get-Content "installer/Awayra.iss" -Raw
          if ($iss -notmatch '#define\s+MyAppVersion\s+"([^"]+)"' -or $Matches[1] -ne $version) {
            throw "installer/Awayra.iss MyAppVersion does not match $version."
          }

          Write-Host "Version $version is consistent across props, manifest and installer."

      - name: Restore solution
        run: dotnet restore Awayra.sln

      - name: Build complete solution
        run: dotnet build Awayra.sln -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test core logic
        run: dotnet test tests/Awayra.Core.Tests/Awayra.Core.Tests.csproj -c Release --no-build --no-restore -p:TreatWarningsAsErrors=true --logger "trx;LogFileName=core-tests.trx" --results-directory artifacts/test-results/core

      - name: Test application logic
        run: dotnet test tests/Awayra.App.Tests/Awayra.App.Tests.csproj -c Release --no-build --no-restore -p:TreatWarningsAsErrors=true --logger "trx;LogFileName=app-tests.trx" --results-directory artifacts/test-results/app

      - name: Validate test evidence
        shell: pwsh
        run: |
          $results = @(Get-ChildItem artifacts/test-results -Recurse -Filter *.trx)
          if ($results.Count -ne 2) {
            throw "Expected two TRX result files, found $($results.Count)."
          }

          foreach ($result in $results) {
            [xml]$trx = Get-Content $result.FullName
            $counters = $trx.TestRun.ResultSummary.Counters
            if ($null -eq $counters -or [int]$counters.total -le 0) {
              throw "No tests were executed in $($result.Name)."
            }
            if ([int]$counters.failed -ne 0) {
              throw "Test failures were recorded in $($result.Name)."
            }
            Write-Host "$($result.Name): total=$($counters.total), passed=$($counters.passed), failed=$($counters.failed)"
          }

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: awayra-test-results-${{ github.run_id }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14