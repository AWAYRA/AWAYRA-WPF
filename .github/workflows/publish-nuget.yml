name: Publish Awayra.Core NuGet package

on:
  push:
    branches: [main]
    paths:
      - 'src/Awayra.Core/**'
      - 'Directory.Build.props'
      - '.github/workflows/publish-nuget.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Awayra.Core/**'
      - 'Directory.Build.props'
      - '.github/workflows/publish-nuget.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: awayra-core-nuget-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: nuget-package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/Awayra.Core.Tests/Awayra.Core.Tests.csproj

      - name: Test core library
        run: dotnet test tests/Awayra.Core.Tests/Awayra.Core.Tests.csproj -c Release --no-restore

      - name: Pack NuGet package
        run: >-
          dotnet pack src/Awayra.Core/Awayra.Core.csproj
          -c Release
          --no-restore
          -o artifacts/nuget
          -p:ContinuousIntegrationBuild=true

      - name: Validate package output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/nuget/AAAItUae.Awayra.Core.*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one Awayra.Core package, found ${#packages[@]}."
            exit 1
          fi
          echo "Package ready: ${packages[0]}"

      - name: Upload pull request package artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Awayra-Core-NuGet-${{ github.event.pull_request.number }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request'
        run: >-
          dotnet nuget push 'artifacts/nuget/*.nupkg'
          --api-key '${{ secrets.GITHUB_TOKEN }}'
          --source 'https://nuget.pkg.github.com/AAA-It-uae/index.json'
          --skip-duplicate
