name: Publish Awayra.Core NuGet package

on:
  push:
    branches: [main]
    paths:
      - 'src/Awayra.Core/**'
      - 'Directory.Build.props'
      - '.github/workflows/publish-nuget.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Awayra.Core/**'
      - 'Directory.Build.props'
      - '.github/workflows/publish-nuget.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  statuses: write

concurrency:
  group: awayra-core-nuget-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: nuget-package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/Awayra.Core.Tests/Awayra.Core.Tests.csproj

      - name: Test core library
        run: dotnet test tests/Awayra.Core.Tests/Awayra.Core.Tests.csproj -c Release --no-restore

      - name: Pack NuGet package
        run: >-
          dotnet pack src/Awayra.Core/Awayra.Core.csproj
          -c Release
          --no-restore
          -o artifacts/nuget
          -p:ContinuousIntegrationBuild=true

      - name: Validate package output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/nuget/AAAItUae.Awayra.Core.*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one Awayra.Core package, found ${#packages[@]}."
            exit 1
          fi
          echo "Package ready: ${packages[0]}"

      - name: Upload pull request package artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Awayra-Core-NuGet-${{ github.event.pull_request.number }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Configure authenticated GitHub Packages source
        if: github.event_name != 'pull_request'
        run: >-
          dotnet nuget add source
          --username '${{ github.actor }}'
          --password '${{ secrets.GITHUB_TOKEN }}'
          --store-password-in-clear-text
          --name github
          'https://nuget.pkg.github.com/AAA-It-uae/index.json'

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/nuget/AAAItUae.Awayra.Core.*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one package before publishing."
            exit 1
          fi
          dotnet nuget push "${packages[0]}" \
            --api-key '${{ secrets.GITHUB_TOKEN }}' \
            --source github \
            --skip-duplicate

      - name: Verify package can be restored
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          version="$(dotnet msbuild src/Awayra.Core/Awayra.Core.csproj -nologo -getProperty:Version | tail -n 1 | tr -d '\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not resolve a semantic package version: $version"
            exit 1
          fi

          mkdir -p artifacts/package-smoke
          cat > artifacts/package-smoke/PackageSmoke.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="AAAItUae.Awayra.Core" Version="$version" />
            </ItemGroup>
          </Project>
          EOF

          for attempt in 1 2 3 4 5 6; do
            if dotnet restore artifacts/package-smoke/PackageSmoke.csproj --no-cache; then
              echo "Verified AAAItUae.Awayra.Core $version from GitHub Packages."
              exit 0
            fi
            echo "Package not available yet; retry $attempt/6 in 10 seconds."
            sleep 10
          done

          echo "Published package could not be restored from GitHub Packages."
          exit 1

      - name: Report package publication status
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Awayra.Core package published and restore-verified"
          else
            state="failure"
            description="Awayra.Core package publication failed"
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="awayra/nuget-package" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
